<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario delle lezioni</title>

<!-- Roboto: font originale della pagina. Su Android è già di sistema; su iPhone/desktop viene caricato da qui. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: #f1f3f4;
    font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #202124;
  }
  body.modal-open { overflow: hidden; }

  /* ---------- Contenitore "schermo" ---------- */
  .screen {
    max-width: 430px;
    min-height: 100vh;
    min-height: 100dvh;
    margin: 0 auto;
    padding: 20px 15px 0;
    background: #fff;
  }
  @media (min-width: 431px) {
    .screen { box-shadow: 0 0 0 1px rgba(0, 0, 0, .06), 0 8px 30px rgba(0, 0, 0, .08); }
  }

  /* ---------- Contenuto replicato ---------- */
  h1 {
    margin: 0;
    font-size: 24px;
    line-height: 28px;
    font-weight: 700;
    color: #202124;
  }

  .event {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-top: 10px;
  }

  .date {
    flex: 0 0 56px;
    padding-top: 2px;
    text-align: center;
  }
  .date .day {
    display: block;
    font-size: 26px;
    line-height: 30px;
    font-weight: 300;
    color: #3c4043;
  }
  .date .month {
    display: block;
    margin-top: 1px;
    font-size: 13px;
    line-height: 18px;
    font-weight: 400;
    color: #70757a;
  }

  .info { flex: 1; min-width: 0; }
  .info p { margin: 0; }

  .time {
    font-size: 16px;
    line-height: 22px;
    font-weight: 700;
    color: #202124;
  }
  .name {
    font-size: 16px;
    line-height: 22px;
    font-weight: 500;
    color: #202124;
  }
  .meta {
    margin-top: 1px;
    font-size: 13px;
    line-height: 20px;
    font-weight: 400;
    color: #202124;
  }

  .prof { color: #007aff; }
  .sep  { margin: 0 7px; color: #80868b; }
  .dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 4px;
    border-radius: 50%;
    background: #34a853;
    vertical-align: -1px;
  }

  /* ---------- "aula 5": aspetto identico al testo, area di tocco più grande ---------- */
  .aula {
    display: inline-block;
    margin: -12px -10px;      /* compensa il padding: layout invariato */
    padding: 12px 10px;       /* area di tocco ~ 61 × 44 px */
    border: 0;
    border-radius: 0;
    background: none;
    font: inherit;
    line-height: inherit;
    text-align: left;
    color: #007aff;
    text-decoration: none;
    white-space: nowrap;
    vertical-align: baseline;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .aula:focus { outline: none; }
  .aula:focus-visible { outline: 2px solid #007aff; outline-offset: -4px; }

  /* ---------- Modale video ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .75);
    opacity: 0;
    visibility: hidden;
    overscroll-behavior: contain;
    transition: opacity .2s ease, visibility .2s ease;
  }
  .overlay.open { opacity: 1; visibility: visible; }

  .box {
    position: relative;
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    border-radius: 12px;
    background: #000;
    box-shadow: 0 10px 40px rgba(0, 0, 0, .5);
  }
  .box video {
    display: block;
    width: 100%;
    height: auto;
    max-height: calc(100vh - 32px);
    max-height: calc(100dvh - 32px);
    background: #000;
  }

  .close {
    position: absolute;
    top: 8px;
    right: 8px;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: rgba(0, 0, 0, .6);
    color: #fff;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  .close:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    .overlay { transition: none; }
  }
</style>
</head>

<body>

<main class="screen">
  <h1>Dal 23 al 28 novembre</h1>

  <section class="event">
    <div class="date">
      <span class="day">24</span>
      <span class="month">mar</span>
    </div>

    <div class="info">
      <p class="time">8:30–17:30</p>
      <p class="name">Graphic Design 2</p>
      <p class="meta"><span class="prof">prof. Azzella</span><span class="sep">|</span><span class="dot"></span>Bari, <button type="button" class="aula" id="aulaBtn" aria-haspopup="dialog">aula 5</button></p>
    </div>
  </section>
</main>

<!-- Popup video -->
<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Video aula 5" aria-hidden="true">
  <div class="box">
    <video id="video" src="video.mp4" controls playsinline webkit-playsinline preload="metadata">
      Il tuo browser non supporta la riproduzione video.
    </video>
    <button type="button" class="close" id="closeBtn" aria-label="Chiudi">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <path d="M5 5l14 14M19 5L5 19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</div>

<script>
  (function () {
    var openBtn  = document.getElementById('aulaBtn');
    var closeBtn = document.getElementById('closeBtn');
    var overlay  = document.getElementById('overlay');
    var video    = document.getElementById('video');

    function openModal() {
      overlay.classList.add('open');
      overlay.setAttribute('aria-hidden', 'false');
      document.body.classList.add('modal-open');
      // play() nello stesso gesto di tocco: permesso anche su iPhone
      var p = video.play();
      if (p && typeof p.catch === 'function') p.catch(function () {});
    }

    function closeModal() {
      video.pause();
      overlay.classList.remove('open');
      overlay.setAttribute('aria-hidden', 'true');
      document.body.classList.remove('modal-open');
    }

    openBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);

    // Tocco sullo sfondo scuro (fuori dal video) = chiudi
    overlay.addEventListener('click', function (e) {
      if (e.target === overlay) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && overlay.classList.contains('open')) closeModal();
    });
  })();
</script>

</body>
</html>
